name: Publish rustdoc

# Builds the rustdoc API site (scripts/build-docs-site.sh) and serves it with
# GitHub Pages at https://joshlacal.github.io/catbird-mls/.
#
# Pull requests build the site but never deploy it. Needs Settings > Pages >
# Build and deployment > Source set to "GitHub Actions".

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdoc-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-site:
    name: Build rustdoc site
    runs-on: ubuntu-24.04
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: catbird-mls
          persist-credentials: false
      # Sibling repo, referenced by a relative path dependency.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: joshlacal/catbird-atproto
          ref: aed64f2c6decd58696f482b9d024dafc407d3aa2
          path: catbird-atproto
          persist-credentials: false
      # Sibling repos, referenced by relative path dependencies: Petrel Rust
      # (AT Protocol types) and its Catbird overlay.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: joshlacal/Petrel
          ref: 76bf7c8beb83fbb861183d04948fa5a061698772
          path: Petrel
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: joshlacal/PetrelCatbird
          ref: 7658265cdc4eebd6cbb37b30fc1f385892168b19
          path: PetrelCatbird
          persist-credentials: false
      # Sibling repo, referenced by a relative path dependency.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: joshlacal/labyrinth
          ref: 9e457eff07373969de4240b849a900e46d42a122
          path: labyrinth
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        working-directory: catbird-mls
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: catbird-mls
          shared-key: rustdoc
      - name: Build the rustdoc site
        shell: bash
        working-directory: catbird-mls
        run: scripts/build-docs-site.sh
      - name: Package the site for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages takes one tar file in an artifact named github-pages.
          tar -cf "$RUNNER_TEMP/artifact.tar" -C "catbird-mls/_site" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
