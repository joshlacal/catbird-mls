[package]
name = "catbird-mls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
catbird_mls = { path = "..", features = ["sim"] }
atproto-spaces = { path = "../../catbird-atproto/atproto-spaces", default-features = false }
labyrinth = { path = "../../labyrinth", features = ["space"] }
labyrinth-protocol = { path = "../../labyrinth/labyrinth-protocol" }
openmls = { version = "=0.9.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["js", "extensions-draft", "fork-resolution", "draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
tls_codec = "=0.5.0"
serde_ipld_dagcbor = "0.6"
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"] }

[[bin]]
name = "mls_message_in"
path = "fuzz_targets/mls_message_in.rs"
test = false
doc = false
bench = false

[[bin]]
name = "welcome_open"
path = "fuzz_targets/welcome_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_package_in"
path = "fuzz_targets/key_package_in.rs"
test = false
doc = false
bench = false

[[bin]]
name = "labyrinth_frame"
path = "fuzz_targets/labyrinth_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dag_cbor_canonical"
path = "fuzz_targets/dag_cbor_canonical.rs"
test = false
doc = false
bench = false
