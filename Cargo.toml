[package]
name = "catbird_mls"
version = "0.1.0"
edition = "2021"
authors = ["Catbird Team"]
description = "Unified MLS SDK for Catbird — OpenMLS operations, orchestration, and UniFFI bindings"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "echo-bot"
path = "src/bin/echo_bot.rs"
required-features = ["echo-bot"]

[[bin]]
name = "circle-report-decrypt"
path = "src/bin/circle-report-decrypt.rs"
required-features = ["labyrinth"]

[[example]]
name = "generate_mls_chat_crypto_wire"
path = "examples/generate_mls_chat_crypto_wire.rs"
required-features = ["test-utils"]

[[test]]
name = "client_labyrinth_fault_lines"
required-features = ["sim"]

[[test]]
name = "push_processor_memory_and_gap"
required-features = ["sim"]

[dependencies]
catbird-atproto = { path = "../../dec1-w0/wave1-catbird-atproto", version = "0.1.0", features = ["streaming", "namespace-bluecatbird", "namespace-atproto-space"] }
atproto-spaces = { path = "../../dec1-w0/wave1-catbird-atproto/atproto-spaces", default-features = false }
labyrinth-protocol = { path = "../labyrinth/labyrinth-protocol" }
# OpenMLS 0.9 release-candidate cutover. The exact revision keeps every
# OpenMLS crate on one coherent source snapshot.
openmls = { version = "=0.9.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["js", "extensions-draft", "fork-resolution", "draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tls_codec = "=0.5.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
multibase = "0.9"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
serde_ipld_dagcbor = "0.6"
cid = "0.11"
ipld-core = "0.4"
http = "1"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
uuid = { version = "1.11", features = ["v4", "js"] }
uniffi = { version = "0.28", features = ["cli"] }
once_cell = "1.21"
lazy_static = "1.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
web-time = "1.1"
scopeguard = "1.2"
tracing = "0.1"
rand = "0.8"
rand_chacha = "0.3"
hpke-rs = { version = "0.7", features = ["hazmat", "serialization"] }
hpke-rs-crypto = "0.7"
hpke-rs-libcrux = "0.7"
libcrux-kem = "0.0.9"
libcrux-ecdh = "0.0.8"
hkdf = "0.12"
hmac = "0.12"
subtle = "2"

# Optional: echo-bot binary
reqwest = { version = "0.12", features = ["json"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Labyrinth 1.1 encrypted chat history over ATProto Spaces (on by default per D4).
labyrinth = { path = "../labyrinth", features = ["space"], optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
blake3 = "1.8.7"
env_logger = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["labyrinth"]
# Android-specific feature flag
android = []
browser = ["labyrinth"]
# Echo bot testing binary — adds reqwest + clap + tracing-subscriber
echo-bot = ["reqwest", "clap", "tracing-subscriber"]
# Enables Catbird's fork-recovery orchestration paths.
fork-resolution = []
# In-process AAD emitters for cross-repository container tests; never UniFFI-exported.
e2e-aad = []
test-utils = ["openmls/test-utils", "openmls_rust_crypto/test-utils", "openmls_memory_storage/test-utils"]
# Labyrinth 1.1 encrypted history backup over ATProto Spaces (enabled by default per D4).
labyrinth = ["dep:labyrinth"]
# Deterministic simulation testing (DST) fault-injection (`buggify!`) and `SimClock` KP lifetime hooks.
sim = ["openmls/unchecked-conversions", "labyrinth?/sim"]
plant_p1 = ["sim"]
plant_p2 = ["sim"]
plant_p3 = ["sim"]
plant_p4 = ["sim"]
plant_p5 = ["sim"]
plant_p6 = ["sim"]
plant_p7 = ["sim"]
plant_p8 = ["sim"]
plant_p9 = ["sim"]
plant_p10 = ["sim"]
plant_p11 = ["sim"]
plant_p12 = ["sim"]
plant_p13 = ["sim"]
plant_p14 = ["sim"]
plant_p15 = ["sim"]
plant_p16 = ["sim", "labyrinth?/plant_p16"]
plant_p17 = ["sim"]
plant_mutation_journal_roll_forward = ["sim"]
plant_oversized_inline_push = ["sim"]

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
audiopus = { version = "0.3.0-rc.0" }
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
audiopus = { version = "0.3.0-rc.0" }
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }
# WASM-compatible getrandom feature unification across transitive semver lines.
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
debug = true  # Generate debug symbols for dSYM creation
