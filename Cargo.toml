[package]
name = "catbird_mls"
version = "0.1.0"
edition = "2021"
authors = ["Catbird Team"]
description = "Unified MLS SDK for Catbird — OpenMLS operations, orchestration, and UniFFI bindings"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "echo-bot"
path = "src/bin/echo_bot.rs"
required-features = ["echo-bot"]

[dependencies]
catbird-atproto = { path = "../catbird-atproto" }
# OpenMLS 0.8.0 — major upgrade from 0.7.2
# Breaking changes handled:
# - ProcessMessageError now includes StorageError variant
# - Group creation fails if GroupId already exists in storage
# - join_by_external_commit deprecated → use external_commit_builder
# - ProposalType, ExtensionType, CredentialType enums have Grease(u16) variant
openmls = { version = "0.8", features = ["test-utils", "js", "extensions-draft-08", "fork-resolution"] }
openmls_traits = { version = "0.5", features = ["extensions-draft-08"] }
openmls_basic_credential = "0.5"
openmls_libcrux_crypto = { version = "0.3", features = ["extensions-draft-08"] }
openmls_rust_crypto = { version = "0.5", features = ["test-utils"] }
openmls_memory_storage = { version = "0.5", features = ["test-utils", "extensions-draft-08"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tls_codec = "0.4"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
# Promoted from transitive to direct for the clean-chat (`chat_v2`) signing
# transcript, which must be byte-identical to the mls-ds server's. Both were
# already linked — ed25519-dalek via openmls_basic_credential, and
# serde_ipld_dagcbor via jacquard-common <- catbird-atproto — and both already
# resolved to the exact versions mls-ds declares directly (2.2.0 and 0.6.4), so
# this is promotion only: no new resolution and no new supply-chain surface.
#
# serde_ipld_dagcbor in particular is used rather than reimplemented BECAUSE
# byte-identity depends on DAG-CBOR's canonical map-key ordering, which is
# length-first and so differs from the plain byte-lexicographic order a BTreeMap
# iterates in. Sharing the crate makes that identity structural.
ed25519-dalek = "2"
serde_ipld_dagcbor = "0.6"
# Promoted from transitive (via catbird-atproto and jacquard-common) for the
# clean-chat reaction predicate, which requires a reaction to be exactly one
# UAX #29 extended grapheme cluster under Unicode 17.0.0. Version 1.13.3
# reports UNICODE_VERSION = (17, 0, 0), and a test asserts that constant rather
# than trusting the pin — a silent data-version bump would otherwise change
# which reactions are accepted.
unicode-segmentation = "1.13"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
uuid = { version = "1.11", features = ["v4", "js"] }
uniffi = { version = "0.28", features = ["cli"] }
once_cell = "1.21"
lazy_static = "1.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
web-time = "1.1"
scopeguard = "1.2"
tracing = "0.1"
rand = "0.8"
hkdf = "0.12"
hmac = "0.12"
subtle = "2"

# Voice message processing (non-wasm only — audiopus_sys's opus C lib has no wasm32 sysroot)

# Optional: echo-bot binary
reqwest = { version = "0.12", features = ["json"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
# Android-specific feature flag (currently unused but reserved for future Android-specific code)
android = []
browser = []
# Echo bot testing binary — adds reqwest + clap + tracing-subscriber
echo-bot = ["reqwest", "clap", "tracing-subscriber"]
# Fork resolution via OpenMLS 0.8.1+ recover_fork_by_readding API.
fork-resolution = []
# Disabled-by-default prototype for letting host platforms provide the OpenMLS
# key-value storage driver over UniFFI. Production native clients continue to
# use openmls_sqlite_storage + HybridStorageProvider unless this feature is
# explicitly enabled for fixture work.
storage-driver-prototype = []

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
openmls_sqlite_storage = { version = "0.2", features = ["extensions-draft-08"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled-sqlcipher"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
audiopus = { version = "0.3.0-rc.0" }
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
openmls_sqlite_storage = { version = "0.2", features = ["extensions-draft-08"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
audiopus = { version = "0.3.0-rc.0" }
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }
# WASM-compatible getrandom feature unification across transitive semver lines.
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
debug = true  # Generate debug symbols for dSYM creation
